name: Sync OpenAPI spec from production

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live spec
        run: |
          curl -sSf https://api.mycelium.global/openapi/v1.json -o /tmp/v1.json
          python3 -c "import json; d = json.load(open('/tmp/v1.json')); assert d['paths'], 'empty spec'"
          python3 -m json.tool /tmp/v1.json > openapi/v1.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- openapi/v1.json; then
            echo "Spec unchanged"
            exit 0
          fi
          git config user.name "mycelium-spec-sync"
          git config user.email "actions@github.com"
          git add openapi/v1.json
          git commit -m "chore: sync OpenAPI spec from production"
          git push
